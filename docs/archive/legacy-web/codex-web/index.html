<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090806">
  <title>Philosopher Atlas | 哲学家图鉴</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Serif+SC:wght@500;700;900&family=Roboto+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="thought-field" aria-hidden="true"></canvas>
  <div class="grain-layer" aria-hidden="true"></div>
  <div class="cursor-light" id="cursor-light" aria-hidden="true"></div>

  <main class="atlas-shell">
    <header class="atlas-header" data-reveal>
      <a class="brand-lockup" href="#top" aria-label="哲学家图鉴首页">
        <span class="brand-seal">Φ</span>
        <span>
          <strong>PHILOSOPHER ATLAS</strong>
          <small>迷雾学派思想标本馆</small>
        </span>
      </a>

      <nav class="school-nav" id="school-nav" aria-label="哲学流派筛选"></nav>

      <label class="search-control" aria-label="检索哲学家或概念">
        <span>⌕</span>
        <input id="search-input" type="search" placeholder="检索人物 / 概念 / 时代">
      </label>
    </header>

    <section class="hero" id="top">
      <div class="hero-copy" data-reveal>
        <p class="eyebrow">Living archive 01</p>
        <h1>哲学家图鉴</h1>
        <p class="hero-lede">
          不是静态名录，而是一座可进入的思想标本馆。每位哲学家是一枚节点：时代、概念、冲突和欲望结构在同一张星图里相互牵引。
        </p>
        <div class="hero-actions">
          <button class="command-btn primary" id="enter-atlas" type="button">
            <span>进入图鉴</span>
            <i>↘</i>
          </button>
          <button class="command-btn" id="shuffle-btn" type="button">
            <span>随机漫游</span>
            <i>⟳</i>
          </button>
        </div>
      </div>

      <div class="hero-instrument" data-reveal>
        <div class="instrument-ring" aria-hidden="true"></div>
        <div class="instrument-core">
          <span id="active-era">公元前 427</span>
          <strong id="hero-active-name">柏拉图</strong>
          <small id="hero-active-vector">理念型谱系起点</small>
        </div>
        <div class="instrument-metrics">
          <span><b id="metric-count">12</b> 人物</span>
          <span><b>48</b> 概念</span>
          <span><b>6</b> 谱系</span>
        </div>
      </div>
    </section>

    <section class="atlas-stage" id="atlas">
      <div class="stage-panel map-panel" data-reveal>
        <div class="section-heading">
          <span>Thought Graph</span>
          <strong>思想星图</strong>
        </div>
        <div class="orbit-map" id="orbit-map" aria-label="哲学家思想星图"></div>
      </div>

      <aside class="stage-panel dossier-panel" id="dossier" data-reveal aria-live="polite"></aside>

      <section class="gallery-panel" data-reveal>
        <div class="section-heading gallery-heading">
          <span>Archive Plates</span>
          <strong>图鉴卡组</strong>
        </div>
        <div class="atlas-grid" id="atlas-grid"></div>
      </section>
    </section>

    <section class="timeline-panel" data-reveal>
      <div class="section-heading">
        <span>Temporal Rail</span>
        <strong>思想时间轴</strong>
      </div>
      <div class="timeline-rail" id="timeline-rail"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
