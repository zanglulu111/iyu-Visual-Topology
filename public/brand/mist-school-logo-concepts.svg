<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1180" role="img" aria-labelledby="title desc">
  <title id="title">迷雾学派 Logo 首轮概念</title>
  <desc id="desc">Three vector logo concepts for Mist School: topological void, sterile crack, and labyrinth monogram.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1800" y2="1180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B0D11"/>
      <stop offset="0.56" stop-color="#141922"/>
      <stop offset="1" stop-color="#1C1715"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2EBD8"/>
      <stop offset="0.52" stop-color="#72D8C7"/>
      <stop offset="1" stop-color="#B96E42"/>
    </linearGradient>
    <linearGradient id="warmText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FAF0D8"/>
      <stop offset="1" stop-color="#D7C29B"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <style>
      .label {
        font-family: Avenir Next, Inter, Helvetica Neue, Arial, sans-serif;
        fill: #8EA0A1;
        font-size: 24px;
        font-weight: 600;
      }
      .cn {
        font-family: Songti SC, STSong, Noto Serif CJK SC, Noto Serif SC, serif;
        fill: url(#warmText);
        font-size: 52px;
        font-weight: 700;
      }
      .en {
        font-family: Avenir Next, Inter, Helvetica Neue, Arial, sans-serif;
        fill: #72D8C7;
        font-size: 18px;
        font-weight: 600;
      }
      .note {
        font-family: Avenir Next, Inter, Helvetica Neue, Arial, sans-serif;
        fill: #C9C1AD;
        font-size: 20px;
        line-height: 1.45;
      }
    </style>
  </defs>

  <rect width="1800" height="1180" fill="url(#bg)"/>
  <g opacity="0.12" fill="none" stroke="#F2EBD8" stroke-width="1.4">
    <path d="M90 173C253 120 408 122 574 174C747 228 909 229 1106 171C1322 107 1518 112 1715 164"/>
    <path d="M50 1008C237 935 408 940 596 999C765 1052 950 1057 1130 1002C1354 934 1534 930 1750 988"/>
  </g>

  <text x="90" y="108" fill="#F8EED8" font-family="Songti SC, STSong, Noto Serif CJK SC, Noto Serif SC, serif" font-size="56" font-weight="700">迷雾学派 Logo 首轮概念</text>
  <text x="92" y="153" fill="#8EA0A1" font-family="Avenir Next, Inter, Helvetica Neue, Arial, sans-serif" font-size="22">Three vector directions: void gravity, sterile crack, labyrinth monogram</text>

  <g transform="translate(90 230)" filter="url(#softShadow)">
    <rect width="500" height="800" rx="28" fill="#10141B" stroke="#2C3540"/>
    <text x="38" y="58" class="label">01 / RECOMMENDED</text>
    <g transform="translate(250 282)" fill="none" stroke-linecap="round">
      <circle r="150" stroke="#F2EBD8" stroke-width="7" opacity="0.94"/>
      <path d="M-106 -106A150 150 0 0 1 121 -89" stroke="#72D8C7" stroke-width="7"/>
      <path d="M108 104A150 150 0 0 1 -122 88" stroke="#B96E42" stroke-width="7"/>
      <ellipse rx="138" ry="49" stroke="url(#orbit)" stroke-width="6"/>
      <ellipse rx="138" ry="49" transform="rotate(58)" stroke="#F2EBD8" stroke-width="4.5" opacity="0.55"/>
      <ellipse rx="138" ry="49" transform="rotate(-58)" stroke="#72D8C7" stroke-width="4.5" opacity="0.58"/>
      <circle r="38" fill="#050609" stroke="#F2EBD8" stroke-width="6"/>
      <path d="M-48 28L48 -28" stroke="#B83B4A" stroke-width="8"/>
      <path d="M-64 38L-42 25M42 -25L64 -38" stroke="#F2EBD8" stroke-width="4" opacity="0.85"/>
    </g>
    <text x="56" y="540" class="cn">迷雾学派</text>
    <text x="60" y="580" class="en">MIST SCHOOL</text>
    <text x="60" y="638" class="note">空洞引力场：主体围绕不可抵达的对象 a 运动。三条轨道暗示拉康式三界；红色斜杠是划杠主体，也是裂痕。</text>
  </g>

  <g transform="translate(650 230)" filter="url(#softShadow)">
    <rect width="500" height="800" rx="28" fill="#F1EBD9" stroke="#C7BFAE"/>
    <text x="38" y="58" class="label" fill="#61706F">02 / SYSTEM SEAL</text>
    <g transform="translate(250 280)">
      <rect x="-132" y="-132" width="264" height="264" rx="18" fill="none" stroke="#161B22" stroke-width="8"/>
      <circle r="92" fill="none" stroke="#161B22" stroke-width="6"/>
      <path d="M-102 -46H-32M28 -46H102M-102 0H-18M18 0H102M-102 46H-42M42 46H102" stroke="#161B22" stroke-width="6" stroke-linecap="round"/>
      <path d="M12 -120C-8 -82 46 -58 17 -18C-15 27 19 56 -7 116" fill="none" stroke="#B83B4A" stroke-width="11" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="27" fill="#F1EBD9" stroke="#161B22" stroke-width="6"/>
      <circle cx="0" cy="0" r="8" fill="#161B22"/>
    </g>
    <text x="56" y="540" fill="#161B22" font-family="Songti SC, STSong, Noto Serif CJK SC, Noto Serif SC, serif" font-size="52" font-weight="700">迷雾学派</text>
    <text x="60" y="580" fill="#B96E42" font-family="Avenir Next, Inter, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="700">MIST SCHOOL</text>
    <text x="60" y="638" fill="#3F4848" font-family="Avenir Next, Inter, Helvetica Neue, Arial, sans-serif" font-size="20">无菌裂痕：理性秩序、档案、学院印章。红色裂线让“有菌的实在”进入完美几何，适合做机构徽章。</text>
  </g>

  <g transform="translate(1210 230)" filter="url(#softShadow)">
    <rect width="500" height="800" rx="28" fill="#11110E" stroke="#343127"/>
    <text x="38" y="58" class="label">03 / APP ICON</text>
    <g transform="translate(250 280)" fill="none" stroke-linejoin="round">
      <path d="M-132 120V-118H-78L-8 0L62 -118H132V120H75V-10L18 83H-18L-75 -10V120Z" stroke="#F2EBD8" stroke-width="16"/>
      <path d="M-92 82H-38M38 82H92M-46 -60H-12M12 -60H48" stroke="#72D8C7" stroke-width="10" stroke-linecap="round"/>
      <circle r="36" fill="#11110E" stroke="#B96E42" stroke-width="9"/>
      <path d="M-44 25L44 -25" stroke="#B83B4A" stroke-width="8" stroke-linecap="round"/>
      <path d="M-124 -144C-57 -169 21 -166 91 -137M-118 149C-51 171 25 169 95 143" stroke="#F2EBD8" stroke-width="5" opacity="0.34" stroke-linecap="round"/>
    </g>
    <text x="56" y="540" class="cn">迷雾学派</text>
    <text x="60" y="580" class="en">MIST SCHOOL</text>
    <text x="60" y="638" class="note">迷宫 M：更偏产品化和 app 图标。识别快，冲击强，但哲学气质稍微直白，可以作为移动端小图标分支。</text>
  </g>

  <g transform="translate(92 1080)">
    <text fill="#F2EBD8" font-family="Avenir Next, Inter, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700">Initial recommendation:</text>
    <text x="245" fill="#C9C1AD" font-family="Avenir Next, Inter, Helvetica Neue, Arial, sans-serif" font-size="22">Use 01 as the master mark, keep 03 for favicon/app icon experiments, and reserve 02 for ceremonial covers or archive seals.</text>
  </g>
</svg>
